services:

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - mongodb

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    environment:
      - CLUSTER_NAME=bigdata
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
    ports:
      - "9870:9870"
      - "8020:8020"
    volumes:
      - namenode-data:/hadoop/dfs/name

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    environment:
      - SERVICE_DEPENDS_ON=namenode:9870
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
    depends_on:
      - namenode
    ports:
      - "9864:9864"
    volumes:
      - datanode-data:/hadoop/dfs/data

  flume:
    build:
      context: ./flume
      dockerfile: Dockerfile
    container_name: flume
    environment:
      FLUME_AGENT_NAME: agent
    depends_on:
      - namenode
      - datanode
    volumes:
      - ./flume/flume.conf:/opt/flume-config/flume.conf
      - ./events.log:/input/events.log
      - flume-data:/flume-data
  
  flink-jobmanager:
    image: flink:1.18-java17
    container_name: flink-jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
    volumes:
      - ./events.log:/input/events.log

  flink-taskmanager:
    image: flink:1.18-java17
    container_name: flink-taskmanager
    command: taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
    volumes:
      - ./events.log:/input/events.log
  
  hbase:
    image: harisekhon/hbase:2.1
    container_name: hbase
    ports:
      - "16010:16010"
      - "16000:16000"
      - "16020:16020"
      - "2181:2181"
    environment:
      HBASE_MANAGES_ZK: "true"
    volumes:
      - hbase-data:/hbase-data

volumes:
  mongo-data:
  flume-data:
  namenode-data:
  datanode-data:
  hbase-data: