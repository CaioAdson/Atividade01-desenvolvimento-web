agent.sources = source1
agent.sinks = sink1
agent.channels = channel1

# SOURCE
agent.sources.source1.type = TAILDIR
agent.sources.source1.channels = channel1
agent.sources.source1.positionFile = /flume-data/taildir_position.json
agent.sources.source1.filegroups = f1
agent.sources.source1.filegroups.f1 = /input/events.log

# SINK HDFS
agent.sinks.sink1.type = hdfs
agent.sinks.sink1.hdfs.path = hdfs://namenode:8020/ecommerce/raw
agent.sinks.sink1.hdfs.filePrefix = events
agent.sinks.sink1.hdfs.fileSuffix = .json
agent.sinks.sink1.hdfs.fileType = DataStream
agent.sinks.sink1.hdfs.writeFormat = Text
agent.sinks.sink1.hdfs.rollInterval = 10
agent.sinks.sink1.hdfs.rollSize = 0
agent.sinks.sink1.hdfs.rollCount = 0
agent.sinks.sink1.channel = channel1

# CHANNEL
agent.channels.channel1.type = memory
agent.channels.channel1.capacity = 1000
agent.channels.channel1.transactionCapacity = 100